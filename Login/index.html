<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body style="background-color: #FFF8E1;">
  <header>
    <Nav><ul><li><a href="../index.html">Back To Registration Form</a></li></ul></Nav>
    <h1 align="center"><u><strong><em>Student Login Form</em></strong></u></h1>
  </header>
  <main>
    <form  align="center" style="background-color: #FFF8E1;">
      <fieldset style="border: 5px solid black; width: 50%; margin: auto; padding: 40px; background-color: #fdf0c5;">
        <legend><strong><em> Login Information</em></strong></legend>
      
      <table border="1" cellpadding="20" cellspacing="5" align="center">
        <tr>
          <td><label for="Username"><strong><em>Username:</em></strong></label></td>
          <td>
            <input type="text" id="Username" name="Username" placeholder="Enter Your Username" required />
          </td>
        </tr>


        <tr>
          <td><label for="Password"><strong><em>Password:</em></strong></label></td>
          <td>
            <input type="password" id="Password" name="Password" placeholder="Enter Your Password" required />
          </td>
        </tr>
        <tr>
          <td><label for="Remember"><strong><em>Remember Me:</em></strong></label></td>
          <td><input type="checkbox" id="Remember" name="Remember Me" required /></td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <button type="submit"><strong><em>Login</em></strong></button>
            <button type="reset"><strong><em>Reset</em></strong></button>
          </td> 
      </table>
      </fieldset>
    </form>
  </main>
  <footer>
    <p align="center">© 2026 Student Login Form. All rights reserved.</p>
  </footer>
</body>

</html>
